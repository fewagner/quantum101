name: Build and deploy PDF

on:
  push:
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# Allow only one concurrent Pages deployment, but let in-progress deploys
# finish so we don't lose a half-published artifact.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    name: Compile LaTeX
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Compile main.tex
        uses: xu-cheng/latex-action@v3
        with:
          root_file: main.tex
          # latexmk is the default; it handles repeated runs + bibtex.

      - name: Stage Pages site
        run: |
          mkdir -p _site
          cp main.pdf _site/main.pdf
          cp index.html _site/index.html

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: _site

  deploy:
    name: Deploy to GitHub Pages
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
